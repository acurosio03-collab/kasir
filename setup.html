
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Admin KASIRPRO</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:#101827;
  color:#fff;
  font-family:Arial,sans-serif
}
.card{
  width:100%;
  max-width:400px;
  padding:25px;
  background:#1c293b;
  border-radius:18px
}
h2{margin-top:0}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  font-size:15px
}
button{
  background:#22c55e;
  color:#07130b;
  font-weight:bold
}
#result{font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h2>KASIRPRO</h2>
  <p>Buat akun admin pertama.</p>

  <form id="setupForm">
    <input id="name" placeholder="Nama admin" required>
    <input id="email" type="email" placeholder="Email admin" required>
    <input id="password" type="password"
      placeholder="Password minimal 12 karakter"
      minlength="12" required>
    <input id="setupKey" type="password"
      placeholder="Kode setup rahasia" required>
    <button type="submit">Buat Akun Admin</button>
  </form>

  <p id="result"></p>
</div>

<script>
document.getElementById("setupForm")
.addEventListener("submit", async function(e){
  e.preventDefault();

  const result = document.getElementById("result");
  result.textContent = "Memproses...";

  try {
    const response = await fetch("/api/setup-admin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-setup-key":
          document.getElementById("setupKey").value
      },
      body: JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();
    result.textContent = data.message ||
      "Terjadi kesalahan.";
  } catch(error) {
    result.textContent = "Tidak dapat terhubung ke server.";
  }
});
</script>
</body>
  </html>
