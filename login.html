
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Admin | KASIRPRO</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:#101827;
  color:#fff;
  font-family:Arial,sans-serif
}
.card{
  width:100%;
  max-width:400px;
  padding:28px;
  background:#1c293b;
  border-radius:18px
}
input,button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:0;
  border-radius:9px;
  font-size:15px
}
button{
  background:#22c55e;
  color:#07130b;
  font-weight:bold
}
#message{font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h2>KASIRPRO</h2>
  <p>Masuk ke dashboard admin.</p>

  <form id="loginForm">
    <input id="email" type="email"
      placeholder="Email admin" required>

    <input id="password" type="password"
      placeholder="Password admin" required>

    <button type="submit">LOGIN</button>
  </form>

  <p id="message"></p>
</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", async function(e){
  e.preventDefault();

  const message = document.getElementById("message");
  message.textContent = "Memeriksa akun...";

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (data.success) {
      message.textContent = "Login berhasil!";
      window.location.href = "/";
    } else {
      message.textContent = data.message || "Login gagal.";
    }

  } catch(error) {
    message.textContent = "Tidak dapat terhubung ke server.";
  }
});
</script>
</body>
      </html>
