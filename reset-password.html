<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password KASIRPRO</title>
</head>
<body>
<h2>Reset Password Admin</h2>

<form id="resetForm">
  <input id="email" type="email" placeholder="Email admin" required>
  <br><br>
  <input id="key" type="password" placeholder="Kunci reset" required>
  <br><br>
  <input id="password" type="password" placeholder="Password baru (minimal 12 karakter)" minlength="12" required>
  <br><br>
  <button type="submit">Reset Password</button>
</form>

<p id="result"></p>

<script>
document.getElementById("resetForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const result = document.getElementById("result");
  result.textContent = "Memproses...";

  try {
    const response = await fetch("/api/reset-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-reset-key": document.getElementById("key").value
      },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        newPassword: document.getElementById("password").value
      })
    });

    const data = await response.json();
    result.textContent = data.message || "Selesai";
  } catch (error) {
    result.textContent = "Gagal menghubungi server.";
  }
});
</script>
</body>
  </html>
