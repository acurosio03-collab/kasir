<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KASIRPRO AI — Kasir Pintar UMKM</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#182230;--muted:#718096;--line:#e5eaf1;--navy:#132238;--green:#16a36a;--green2:#e8f8f0;--red:#dc4c4c;--amber:#d88b12;--shadow:0 8px 28px rgba(20,38,60,.06)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;font-weight:650;transition:.15s}button:focus,input:focus,select:focus{outline:2px solid #7bd7ac;outline-offset:1px}.primary{background:var(--green);color:white}.primary:hover{background:#118b59}.secondary{background:#edf2f7;color:#253449}.danger{background:#fff0f0;color:var(--red)}.tiny{padding:6px 9px;font-size:12px}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:22px 15px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#25c281,#0c7951);display:grid;place-items:center;font-weight:900;font-size:17px}.brand strong{display:block;letter-spacing:.3px}.brand small{color:#aebed0;font-size:11px}.nav-label{color:#8195ac;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:0 12px;margin-bottom:4px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#c3cedb;text-align:left;display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#243a52;color:white}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;background:#1d334b;padding:14px;border-radius:13px;color:#c6d3df;font-size:12px}.side-bottom b{color:white}.main{min-width:0}.topbar{height:76px;background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.eyebrow{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase}.topbar h1{font-size:20px;margin:3px 0 0}.top-right{display:flex;align-items:center;gap:10px}.pill{background:var(--green2);color:#087a4a;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:750}.avatar{width:35px;height:35px;border-radius:50%;background:#e6eef8;color:#1e3a59;display:grid;place-items:center;font-weight:800}.content{padding:27px 30px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.page-head h2{font-size:23px;margin:0 0 4px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:35px;height:35px;border-radius:11px;background:#eef8f3;display:grid;place-items:center;font-size:17px}.stat-value{font-size:24px;font-weight:850;letter-spacing:-.6px;margin:13px 0 5px}.stat-note{font-size:11px;color:var(--muted)}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:17px}.panel-head h3{margin:0;font-size:15px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px}.bars{height:180px;display:flex;align-items:end;gap:12px;padding:15px 4px 0;border-bottom:1px solid var(--line)}.bar-col{flex:1;min-width:0;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:min(35px,75%);background:linear-gradient(180deg,#41c98a,#149b63);border-radius:7px 7px 2px 2px;min-height:3px}.bar-col small{font-size:10px;color:var(--muted)}.bar-col span{font-size:10px;color:#526174}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;background:white;color:var(--ink)}.quick:hover{border-color:#82d6ae;background:#f7fffa}.quick b{display:block;margin:6px 0 2px}.quick small{color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;font-size:10px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #edf0f5;font-size:12px}tbody tr:last-child td{border-bottom:0}.prod-name{font-weight:750}.sub{display:block;font-size:11px;color:var(--muted);margin-top:3px}.badge{display:inline-block;border-radius:20px;padding:5px 8px;background:#edf8f2;color:#0b8854;font-size:10px;font-weight:750}.badge.warn{background:#fff5df;color:#a76b00}.badge.low{background:#ffeded;color:#c13c3c}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{border:1px solid #dfe5ed;border-radius:10px;background:white;padding:10px 12px;min-width:0;color:var(--ink)}.search{flex:1;min-width:170px}.field-label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-row{min-width:0}.form-row input,.form-row select{width:100%}.full{grid-column:1/-1}.pos-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.85fr);gap:18px;align-items:start}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product-card{background:white;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;min-width:0;color:var(--ink)}.product-card:hover{border-color:#57c994;box-shadow:0 5px 16px #16a36a14}.product-emoji{height:65px;border-radius:9px;background:#f3f7f9;display:grid;place-items:center;font-size:29px;margin-bottom:10px}.product-card b{display:block;overflow:hidden;text-overflow:ellipsis}.product-card small{color:var(--muted);display:block;margin-top:4px}.product-card strong{display:block;margin-top:9px;color:#0c8955}.cart-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.cart-item:last-child{border:0}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{padding:3px 8px;background:#eef2f6}.totals{border-top:1px dashed #d7e0e9;margin-top:10px;padding-top:12px}.total-row{display:flex;justify-content:space-between;margin:9px 0;font-size:12px}.total-row.grand{font-size:18px;font-weight:850;margin-top:15px}.empty{text-align:center;padding:30px 15px;color:var(--muted)}.empty .big{font-size:35px;margin-bottom:7px}.notice{background:#f0f8ff;border:1px solid #d8eafd;color:#345a7a;border-radius:10px;padding:12px;font-size:12px;margin-bottom:15px}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#0c1728a6;z-index:20;display:grid;place-items:center;padding:16px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:17px;padding:23px;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;background:#132238;color:white;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:50;max-width:90vw}.footer{color:#98a4b4;text-align:center;font-size:11px;padding:15px}.mobile-menu{display:none}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.pos-layout{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;top:0;bottom:0;width:240px;z-index:30;transition:left .2s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{padding:0 15px;height:67px}.content{padding:18px 13px}.top-right .pill{display:none}.page-head{align-items:flex-start}.page-head h2{font-size:20px}.cards{gap:9px}.stat{padding:13px}.stat-value{font-size:20px}.stat-top{font-size:11px}.stat-icon{width:29px;height:29px}.panel{padding:14px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar h1{font-size:17px}.topbar .eyebrow{font-size:9px}}
@media print{body *{visibility:hidden!important}#receiptPrint,#receiptPrint *{visibility:visible!important}#receiptPrint{position:absolute;left:0;top:0;width:100%;padding:8px;color:#000;background:#fff}.no-print{display:none!important}}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">K</div><div><strong>KASIRPRO <span style="color:#43d69b">AI</span></strong><small>SMART UMKM SYSTEM</small></div></div>
  <div><div class="nav-label">MENU UTAMA</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="pos"><span class="ico">▣</span> Kasir / POS</button>
    <button data-page="products"><span class="ico">▤</span> Produk & Stok</button>
    <button data-page="transactions"><span class="ico">↔</span> Transaksi</button>
    <button data-page="reports"><span class="ico">▥</span> Laporan</button>
    <button data-page="expenses"><span class="ico">↗</span> Pengeluaran</button>
    <button data-page="settings"><span class="ico">⚙</span> Pengaturan</button>
  </nav></div>
  <div class="side-bottom"><b>Mode Demo Lokal</b><br>Data tersimpan di browser perangkat ini. Hubungkan Supabase untuk penggunaan online multi-perangkat.</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;gap:10px;align-items:center"><button class="secondary mobile-menu" id="mobileMenu">☰</button><div><div class="eyebrow">SMART BUSINESS MANAGEMENT</div><h1 id="topTitle">Dashboard</h1></div></div><div class="top-right"><span class="pill">● Sistem aktif</span><div class="avatar">GH</div></div></header>
<div class="content" id="content"></div>
<div class="footer">KASIRPRO AI · Dibuat untuk UMKM Indonesia · GERDY HENDRAMAN</div>
</main></div>
<div id="modalRoot"></div><div id="toastRoot"></div><div id="receiptPrint" class="hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
const dt=s=>s?new Date(s).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const defaultProducts=[
{id:'p1',name:'Kopi Susu Gula Aren',sku:'MIN-001',category:'Minuman',buy:7000,price:15000,stock:28,min:5,emoji:'☕'},
{id:'p2',name:'Es Teh Manis',sku:'MIN-002',category:'Minuman',buy:2000,price:6000,stock:45,min:10,emoji:'🧋'},
{id:'p3',name:'Roti Cokelat',sku:'MAK-001',category:'Makanan',buy:4000,price:8000,stock:17,min:5,emoji:'🥐'},
{id:'p4',name:'Mie Goreng',sku:'MAK-002',category:'Makanan',buy:8000,price:14000,stock:12,min:4,emoji:'🍜'},
{id:'p5',name:'Air Mineral',sku:'MIN-003',category:'Minuman',buy:2500,price:5000,stock:36,min:8,emoji:'💧'},
{id:'p6',name:'Kentang Goreng',sku:'MAK-003',category:'Makanan',buy:6000,price:12000,stock:9,min:4,emoji:'🍟'}
];
function load(key,fallback){try{const v=JSON.parse(localStorage.getItem('kasirpro_'+key));return v??fallback}catch{return fallback}}
let products=load('products',defaultProducts), sales=load('sales',[]), expenses=load('expenses',[]), settings=load('settings',{business:'KASIRPRO UMKM',owner:'GERDY HENDRAMAN',tax:0});
let cart=[],activePage='dashboard';
function save(){localStorage.setItem('kasirpro_products',JSON.stringify(products));localStorage.setItem('kasirpro_sales',JSON.stringify(sales));localStorage.setItem('kasirpro_expenses',JSON.stringify(expenses));localStorage.setItem('kasirpro_settings',JSON.stringify(settings))}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(page){activePage=page;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
function pageHead(title,desc,action=''){return `<div class="page-head"><div><h2>${title}</h2><div class="muted">${desc}</div></div>${action}</div>`}
function stat(label,value,icon,note){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function sum(list,fn){return list.reduce((a,x)=>a+fn(x),0)}
function todaysSales(){return sales.filter(s=>s.date.slice(0,10)===today())}
function totalSales(list){return sum(list,s=>s.total)}
function totalCOGS(list){return sum(list,s=>s.items.reduce((n,i)=>n+(Number(i.buy)||0)*i.qty,0))}
function totalExpenses(){return sum(expenses.filter(e=>e.date===today()),e=>e.amount)}
function dashboard(){
const ts=todaysSales(),revenue=totalSales(ts),profit=revenue-totalCOGS(ts),low=products.filter(p=>p.stock<=p.min);
const last7=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let key=d.toISOString().slice(0,10);return {key,label:d.toLocaleDateString('id-ID',{weekday:'short'}),value:totalSales(sales.filter(s=>s.date.slice(0,10)===key))}});
let max=Math.max(1,...last7.map(x=>x.value));
const sold={};sales.forEach(s=>s.items.forEach(i=>sold[i.name]=(sold[i.name]||0)+i.qty));
const best=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,5);
return `${pageHead('Ringkasan Bisnis','Pantau performa usaha kamu hari ini.',`<button class="primary" onclick="setPage('pos')">＋ Transaksi Baru</button>`)}
<div class="cards">${stat('Omzet Hari Ini',rupiah(revenue),'↗',`${ts.length} transaksi selesai`)}${stat('Estimasi Laba Kotor',rupiah(profit),'◈','Omzet dikurangi HPP barang terjual')}${stat('Total Transaksi',ts.length,'▣','Transaksi hari ini')}${stat('Stok Menipis',low.length,'⚠',low.length?'Perlu segera diperiksa':'Semua stok aman')}</div>
<div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Tren Penjualan</h3><p>Omzet selama 7 hari terakhir</p></div><span class="badge">7 hari</span></div><div class="bars">${last7.map(x=>`<div class="bar-col"><span>${x.value?rupiah(x.value).replace(',00',''):'-'}</span><div class="bar" style="height:${Math.max(3,x.value/max*75)}%"></div><small>${x.label}</small></div>`).join('')}</div></section>
<section class="panel"><div class="panel-head"><div><h3>Akses Cepat</h3><p>Fitur yang sering digunakan</p></div></div><div class="quick-grid"><button class="quick" onclick="setPage('pos')">🧾<b>Buka Kasir</b><small>Mulai penjualan</small></button><button class="quick" onclick="openProductModal()">📦<b>Tambah Produk</b><small>Kelola katalog</small></button><button class="quick" onclick="setPage('reports')">📊<b>Lihat Laporan</b><small>Analisis penjualan</small></button><button class="quick" onclick="setPage('expenses')">💸<b>Catat Biaya</b><small>Pengeluaran usaha</small></button></div></section></div>
<div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Transaksi Terbaru</h3><p>Aktivitas penjualan terakhir</p></div><button class="secondary tiny" onclick="setPage('transactions')">Lihat semua</button></div>${transactionTable(sales.slice().reverse().slice(0,5))}</section>
<section class="panel"><div class="panel-head"><div><h3>Perlu Perhatian</h3><p>Stok di bawah batas minimum</p></div><button class="secondary tiny" onclick="setPage('products')">Kelola stok</button></div>${low.length?`<div class="table-wrap"><table><thead><tr><th>Produk</th><th>Sisa stok</th></tr></thead><tbody>${low.slice(0,6).map(p=>`<tr><td><b>${esc(p.name)}</b><span class="sub">${esc(p.sku)}</span></td><td><span class="badge low">${p.stock} unit</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">✅</div>Stok masih aman</div>`}</section></div>
<div class="panel"><div class="panel-head"><div><h3>Produk Terlaris</h3><p>Berdasarkan jumlah unit yang pernah terjual</p></div></div>${best.length?`<div class="table-wrap"><table><thead><tr><th>Produk</th><th>Terjual</th></tr></thead><tbody>${best.map(([n,q])=>`<tr><td>${esc(n)}</td><td><b>${q} unit</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Belum ada data penjualan. Mulai transaksi pertamamu!</div>`}</div>`;
}
function transactionTable(list){if(!list.length)return `<div class="empty">Belum ada transaksi.</div>`;return `<div class="table-wrap"><table><thead><tr><th>No. Transaksi</th><th>Waktu</th><th>Item</th><th>Total</th><th>Bayar</th><th>Status</th></tr></thead><tbody>${list.map(s=>`<tr><td><b>${esc(s.id)}</b></td><td>${dt(s.date)}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)} unit</td><td><b>${rupiah(s.total)}</b></td><td>${esc(s.payment)}</td><td><span class="badge">Selesai</span></td></tr>`).join('')}</tbody></table></div>`}
function productsPage(){return `${pageHead('Produk & Stok','Kelola katalog, harga, dan persediaan.',`<button class="primary" onclick="openProductModal()">＋ Tambah Produk</button>`)}
<div class="cards">${stat('Total Produk',products.length,'▤','Produk aktif')}${stat('Total Unit Stok',sum(products,p=>p.stock),'📦','Akumulasi seluruh stok')}${stat('Nilai Modal Stok',rupiah(sum(products,p=>p.stock*p.buy)),'◈','Estimasi berdasarkan harga beli')}${stat('Stok Menipis',products.filter(p=>p.stock<=p.min).length,'⚠','Di bawah batas minimum')}</div>
<div class="panel"><div class="toolbar"><input class="field search" id="productSearch" placeholder="Cari nama, SKU, atau kategori…"><select class="field" id="categoryFilter"><option value="">Semua kategori</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="secondary" onclick="exportProducts()">⇩ Ekspor CSV</button></div><div id="productTable">${productTable(products)}</div></div>`}
function productTable(list){if(!list.length)return `<div class="empty">Produk tidak ditemukan.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Produk</th><th>SKU / Kategori</th><th>Harga beli</th><th>Harga jual</th><th>Stok</th><th>Margin</th><th>Aksi</th></tr></thead><tbody>${list.map(p=>`<tr><td><span style="font-size:20px;margin-right:8px">${esc(p.emoji||'📦')}</span><span class="prod-name">${esc(p.name)}</span></td><td>${esc(p.sku)}<span class="sub">${esc(p.category)}</span></td><td>${rupiah(p.buy)}</td><td><b>${rupiah(p.price)}</b></td><td><span class="badge ${p.stock<=p.min?'low':p.stock<=p.min*1.5?'warn':''}">${p.stock}</span></td><td>${p.price?Math.round((p.price-p.buy)/p.price*100):0}%</td><td><button class="secondary tiny" onclick="openProductModal('${p.id}')">Edit</button> <button class="danger tiny" onclick="adjustStock('${p.id}')">Stok ±</button></td></tr>`).join('')}</tbody></table></div>`}
function posPage(){let subtotal=cart.reduce((a,i)=>a+i.price*i.qty,0),tax=Math.round(subtotal*(Number(settings.tax)||0)/100),total=subtotal+tax;return `${pageHead('Kasir / POS','Pilih produk, atur jumlah, lalu selesaikan pembayaran.',`<span class="badge">● Siap melayani</span>`)}
<div class="notice">Mode demo lokal: transaksi disimpan di browser ini. Gunakan koneksi database sebelum dipakai sebagai kasir produksi.</div>
<div class="pos-layout"><section class="panel"><div class="toolbar"><input class="field search" id="posSearch" placeholder="Cari produk atau scan SKU/barcode…"><select class="field" id="posCategory"><option value="">Semua kategori</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="product-grid" id="posProducts">${posProducts(products)}</div></section>
<section class="panel"><div class="panel-head"><div><h3>🛒 Keranjang</h3><p>${cart.reduce((a,i)=>a+i.qty,0)} item dipilih</p></div><button class="danger tiny" onclick="clearCart()">Kosongkan</button></div><div id="cartItems">${cartHTML()}</div><div class="totals"><div class="total-row"><span>Subtotal</span><b>${rupiah(subtotal)}</b></div><div class="total-row"><span>Pajak (${Number(settings.tax)||0}%)</span><b>${rupiah(tax)}</b></div><div class="total-row grand"><span>Total</span><span>${rupiah(total)}</span></div><div class="form-row" style="margin-top:14px"><label class="field-label">Metode pembayaran</label><select class="field" id="payMethod" style="width:100%"><option>Tunai</option><option>QRIS</option><option>Transfer bank</option><option>Debit</option></select></div><div class="form-row" style="margin-top:12px"><label class="field-label">Uang diterima (Rp)</label><input class="field" id="cashReceived" type="number" min="0" placeholder="Masukkan nominal" style="width:100%" oninput="updateChange()"></div><div class="total-row"><span>Kembalian</span><b id="changeAmount">${rupiah(0)}</b></div><button class="primary" style="width:100%;margin-top:10px;padding:14px" onclick="checkout()">✓ Selesaikan Pembayaran</button></div></section></div>`}
function posProducts(list){if(!list.length)return `<div class="empty">Produk tidak ditemukan.</div>`;return list.map(p=>`<button class="product-card" onclick="addCart('${p.id}')" ${p.stock<=0?'disabled':''}><div class="product-emoji">${esc(p.emoji||'📦')}</div><b>${esc(p.name)}</b><small>${esc(p.sku)} · Stok ${p.stock}</small><strong>${rupiah(p.price)}</strong></button>`).join('')}
function cartHTML(){if(!cart.length)return `<div class="empty"><div class="big">🛒</div>Keranjang masih kosong.<br><small>Pilih produk di sebelah kiri.</small></div>`;return cart.map(i=>`<div class="cart-item"><div><b>${esc(i.name)}</b><div class="sub">${rupiah(i.price)} / unit</div><div class="qty"><button onclick="changeQty('${i.id}',-1)">−</button><b>${i.qty}</b><button onclick="changeQty('${i.id}',1)">+</button><button class="danger tiny" onclick="removeCart('${i.id}')">Hapus</button></div></div><b>${rupiah(i.price*i.qty)}</b></div>`).join('')}
function bindPos(){const search=$('#posSearch'),cat=$('#posCategory');const filter=()=>{let q=search.value.toLowerCase(),c=cat.value;$('#posProducts').innerHTML=posProducts(products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q)&&(!c||p.category===c)))};search.oninput=filter;cat.onchange=filter}
function addCart(id){const p=products.find(p=>p.id===id);if(!p||p.stock<1)return toast('Stok produk habis.');let it=cart.find(i=>i.id===id);if(it){if(it.qty>=p.stock)return toast('Jumlah melebihi stok tersedia.');it.qty++}else cart.push({id:p.id,name:p.name,price:Number(p.price),buy:Number(p.buy),qty:1});render()}
function changeQty(id,n){const i=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);if(!i)return;if(i.qty+n<1){removeCart(id);return}if(n>0&&i.qty+n>p.stock)return toast('Jumlah melebihi stok tersedia.');i.qty+=n;render()}
function removeCart(id){cart=cart.filter(i=>i.id!==id);render()}
function clearCart(){cart=[];render()}
function updateChange(){let subtotal=cart.reduce((a,i)=>a+i.price*i.qty,0),total=subtotal+Math.round(subtotal*(Number(settings.tax)||0)/100),cash=Number($('#cashReceived')?.value||0);if($('#changeAmount'))$('#changeAmount').textContent=rupiah(Math.max(0,cash-total))}
function checkout(){if(!cart.length)return toast('Keranjang masih kosong.');for(const i of cart){const p=products.find(p=>p.id===i.id);if(!p||p.stock<i.qty)return toast(`Stok ${i.name} tidak mencukupi.`)}
const subtotal=cart.reduce((a,i)=>a+i.price*i.qty,0),tax=Math.round(subtotal*(Number(settings.tax)||0)/100),total=subtotal+tax,method=$('#payMethod').value,cash=method==='Tunai'?Number($('#cashReceived').value||0):total;if(cash<total)return toast('Uang diterima belum mencukupi.');
const sale={id:'TRX-'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,5).toUpperCase(),date:new Date().toISOString(),items:cart.map(i=>({...i})),subtotal,tax,total,payment:method,cash,change:Math.max(0,cash-total)};
sale.items.forEach(i=>{const p=products.find(p=>p.id===i.id);p.stock-=i.qty});sales.push(sale);save();cart=[];printReceipt(sale);toast('Transaksi berhasil disimpan.');setPage('transactions')}
function printReceipt(s){$('#receiptPrint').innerHTML=`<div style="font-family:monospace;max-width:300px;margin:auto"><center><h2>${esc(settings.business)}</h2><p>${esc(settings.owner)}</p><p>STRUK PEMBELIAN</p></center><hr><p>No: ${esc(s.id)}<br>${dt(s.date)}</p><hr>${s.items.map(i=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(i.name)} x${i.qty}</span><span>${rupiah(i.price*i.qty)}</span></div>`).join('')}<hr><div style="display:flex;justify-content:space-between"><b>Total</b><b>${rupiah(s.total)}</b></div><p>Metode: ${esc(s.payment)}<br>Dibayar: ${rupiah(s.cash)}<br>Kembalian: ${rupiah(s.change)}</p><center>Terima kasih telah berbelanja!</center><p class="no-print" style="text-align:center">Gunakan tombol Cetak struk pada halaman transaksi.</p></div>`;$('#receiptPrint').classList.remove('hidden')}
function transactionsPage(){return `${pageHead('Riwayat Transaksi','Telusuri penjualan dan cetak ulang struk.',`<button class="secondary" onclick="exportSales()">⇩ Ekspor CSV</button>`)}<div class="panel"><div class="toolbar"><input class="field search" id="trxSearch" placeholder="Cari nomor transaksi…"><input class="field" type="date" id="trxDate"></div><div id="trxTable">${transactionTable(sales.slice().reverse())}</div></div>`}
function bindTransactions(){const q=$('#trxSearch'),d=$('#trxDate');const filter=()=>{let list=sales.slice().reverse().filter(s=>(s.id+' '+s.payment).toLowerCase().includes(q.value.toLowerCase())&&(!d.value||s.date.slice(0,10)===d.value));$('#trxTable').innerHTML=transactionTable(list)+ (list.length?`<div style="margin-top:14px"><button class="secondary tiny" onclick="printSelectedLast()">Cetak struk transaksi terbaru</button></div>`:'')};q.oninput=filter;d.onchange=filter}
function printSelectedLast(){if(!sales.length)return;printReceipt(sales[sales.length-1]);window.print()}
function reportsPage(){const all=sales,rev=totalSales(all),cogs=totalCOGS(all),exp=sum(expenses,e=>e.amount),byPay={};all.forEach(s=>byPay[s.payment]=(byPay[s.payment]||0)+s.total);return `${pageHead('Laporan Bisnis','Ringkasan performa penjualan dan estimasi keuntungan.',`<button class="secondary" onclick="exportSales()">⇩ Ekspor penjualan</button>`)}
<div class="cards">${stat('Total Omzet',rupiah(rev),'↗',`${all.length} transaksi tercatat`)}${stat('HPP Terjual',rupiah(cogs),'📦','Berdasarkan harga beli produk')}${stat('Laba Kotor Estimasi',rupiah(rev-cogs),'◈','Omzet dikurangi HPP')}${stat('Pengeluaran Tercatat',rupiah(exp),'↘','Semua pengeluaran yang dicatat')}</div>
<div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Ringkasan Pembayaran</h3><p>Nilai penjualan per metode pembayaran</p></div></div>${Object.keys(byPay).length?`<table><thead><tr><th>Metode</th><th>Total</th><th>Persentase</th></tr></thead><tbody>${Object.entries(byPay).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${rupiah(v)}</td><td>${rev?Math.round(v/rev*100):0}%</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Belum ada transaksi.</div>`}</section>
<section class="panel"><div class="panel-head"><div><h3>Ringkasan Keuangan</h3><p>Estimasi berdasarkan data yang dicatat</p></div></div><div class="total-row"><span>Omzet</span><b>${rupiah(rev)}</b></div><div class="total-row"><span>HPP barang terjual</span><b>− ${rupiah(cogs)}</b></div><div class="total-row"><span>Laba kotor</span><b>${rupiah(rev-cogs)}</b></div><div class="total-row"><span>Pengeluaran tercatat</span><b>− ${rupiah(exp)}</b></div><div class="total-row grand"><span>Estimasi laba setelah biaya</span><span>${rupiah(rev-cogs-exp)}</span></div><p class="muted" style="font-size:11px">Catatan: laporan sederhana ini belum memperhitungkan seluruh kewajiban pajak, depresiasi, atau penyesuaian akuntansi.</p></section></div>
<div class="panel"><div class="panel-head"><div><h3>Ringkasan Stok</h3><p>Nilai persediaan berdasarkan harga beli</p></div></div><div class="cards" style="margin:0">${stat('Jumlah SKU',products.length,'▤','Produk terdaftar')}${stat('Total unit',sum(products,p=>p.stock),'📦','Sisa stok saat ini')}${stat('Nilai modal stok',rupiah(sum(products,p=>p.stock*p.buy)),'◈','Estimasi nilai persediaan')}${stat('Produk stok rendah',products.filter(p=>p.stock<=p.min).length,'⚠','Perlu restock')}</div></div>`}
function expensesPage(){return `${pageHead('Pengeluaran','Catat biaya operasional agar estimasi laba lebih masuk akal.',`<button class="primary" onclick="openExpenseModal()">＋ Catat Pengeluaran</button>`)}
<div class="cards">${stat('Total Pengeluaran',rupiah(sum(expenses,e=>e.amount)),'↘','Semua catatan biaya')}${stat('Pengeluaran Hari Ini',rupiah(sum(expenses.filter(e=>e.date===today()),e=>e.amount)),'▣','Biaya tanggal hari ini')}${stat('Kategori Biaya',new Set(expenses.map(e=>e.category)).size,'▤','Kategori tercatat')}${stat('Jumlah Catatan',expenses.length,'≡','Riwayat pengeluaran')}</div>
<div class="panel"><div class="panel-head"><div><h3>Riwayat Pengeluaran</h3><p>Catatan biaya usaha</p></div></div>${expenses.length?`<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${expenses.slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td><b>${esc(e.note)}</b></td><td>${esc(e.category)}</td><td><b>${rupiah(e.amount)}</b></td><td><button class="danger tiny" onclick="deleteExpense('${e.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🧾</div>Belum ada pengeluaran tercatat.</div>`}</div>`}
function settingsPage(){return `${pageHead('Pengaturan','Atur identitas usaha dan pajak transaksi.')}
<div class="panel"><div class="panel-head"><div><h3>Profil Usaha</h3><p>Informasi yang muncul pada struk</p></div></div><form id="settingsForm"><div class="form-grid"><div class="form-row"><label class="field-label">Nama usaha</label><input class="field" name="business" required value="${esc(settings.business)}"></div><div class="form-row"><label class="field-label">Nama pemilik / pengelola</label><input class="field" name="owner" value="${esc(settings.owner)}"></div><div class="form-row"><label class="field-label">Pajak transaksi (%)</label><input class="field" name="tax" type="number" min="0" max="100" value="${Number(settings.tax)||0}"></div></div><button class="primary" style="margin-top:16px">Simpan Pengaturan</button></form></div>
<div class="panel"><div class="panel-head"><div><h3>Data Demo</h3><p>Ekspor cadangan atau reset data lokal.</p></div></div><div class="toolbar"><button class="secondary" onclick="backupData()">⇩ Unduh backup JSON</button><button class="danger" onclick="resetDemo()">Reset ke data contoh</button></div><div class="notice">Data disimpan pada browser/perangkat yang sedang digunakan. Menghapus data browser dapat menghilangkan data ini. Untuk data online, login multi-user, sinkronisasi antarperangkat, dan keamanan produksi, hubungkan backend Supabase.</div></div>`}
function render(){const titles={dashboard:'Dashboard',pos:'Kasir / POS',products:'Produk & Stok',transactions:'Riwayat Transaksi',reports:'Laporan Bisnis',expenses:'Pengeluaran',settings:'Pengaturan'};$('#topTitle').textContent=titles[activePage]||'KASIRPRO';let html=({dashboard,products:productsPage,pos:posPage,transactions:transactionsPage,reports:reportsPage,expenses:expensesPage,settings:settingsPage})[activePage]();$('#content').innerHTML=html;if(activePage==='products')bindProducts();if(activePage==='pos'){bindPos();updateChange()}if(activePage==='transactions')bindTransactions();if(activePage==='settings')$('#settingsForm').onsubmit=saveSettings}
function bindProducts(){const q=$('#productSearch'),c=$('#categoryFilter');const filter=()=>$('#productTable').innerHTML=productTable(products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q.value.toLowerCase())&&(!c.value||p.category===c.value)));q.oninput=filter;c.onchange=filter}
function openModal(title,body,submitLabel,submit){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><h3>${title}</h3><form id="modalForm">${body}<div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary" type="submit">${submitLabel}</button></div></form></div></div>`;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};$('#modalForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target))}}
function closeModal(){$('#modalRoot').innerHTML=''}
function openProductModal(id){const p=products.find(x=>x.id===id)||{name:'',sku:'',category:'Umum',buy:'',price:'',stock:0,min:3,emoji:'📦'};openModal(id?'Edit Produk':'Tambah Produk',`<div class="form-grid"><div class="form-row full"><label class="field-label">Nama produk *</label><input class="field" name="name" required value="${esc(p.name)}"></div><div class="form-row"><label class="field-label">SKU / kode</label><input class="field" name="sku" value="${esc(p.sku)}"></div><div class="form-row"><label class="field-label">Kategori</label><input class="field" name="category" value="${esc(p.category)}" required></div><div class="form-row"><label class="field-label">Harga beli (Rp)</label><input class="field" name="buy" type="number" min="0" required value="${p.buy}"></div><div class="form-row"><label class="field-label">Harga jual (Rp)</label><input class="field" name="price" type="number" min="0" required value="${p.price}"></div><div class="form-row"><label class="field-label">Stok saat ini</label><input class="field" name="stock" type="number" min="0" required value="${p.stock}" ${id?'readonly':''}></div><div class="form-row"><label class="field-label">Batas stok minimum</label><input class="field" name="min" type="number" min="0" required value="${p.min}"></div><div class="form-row full"><label class="field-label">Emoji produk</label><input class="field" name="emoji" value="${esc(p.emoji||'📦')}" maxlength="8"></div></div>${id?'<p class="muted" style="font-size:11px">Untuk menyesuaikan stok, gunakan tombol Stok ± di tabel produk.</p>':''}`,id?'Simpan Perubahan':'Tambah Produk',f=>{const data={name:f.get('name').trim(),sku:f.get('sku').trim()||'SKU-'+uid().toUpperCase(),category:f.get('category').trim(),buy:Number(f.get('buy')),price:Number(f.get('price')),stock:Number(f.get('stock')),min:Number(f.get('min')),emoji:f.get('emoji')||'📦'};if(data.price<0||data.buy<0||data.stock<0)return toast('Nilai tidak boleh negatif.');if(products.some(x=>x.sku===data.sku&&x.id!==id))return toast('SKU sudah digunakan.');if(id)Object.assign(products.find(x=>x.id===id),data);else products.push({id:uid(),...data});save();closeModal();render();toast('Data produk berhasil disimpan.')})}
function adjustStock(id){const p=products.find(x=>x.id===id);if(!p)return;openModal('Penyesuaian Stok',`<p>Produk: <b>${esc(p.name)}</b><br>Stok saat ini: <b>${p.stock}</b></p><div class="form-row"><label class="field-label">Perubahan stok (+ masuk / − keluar)</label><input class="field" name="delta" type="number" required value="1"></div><div class="form-row" style="margin-top:12px"><label class="field-label">Alasan</label><input class="field" name="reason" required placeholder="Contoh: stok opname / barang masuk"></div>`, 'Simpan Stok',f=>{let delta=Number(f.get('delta'));if(p.stock+delta<0)return toast('Stok tidak boleh negatif.');p.stock+=delta;save();closeModal();render();toast('Stok berhasil disesuaikan.')})}
function openExpenseModal(){openModal('Catat Pengeluaran',`<div class="form-grid"><div class="form-row"><label class="field-label">Tanggal</label><input class="field" name="date" type="date" value="${today()}" required></div><div class="form-row"><label class="field-label">Kategori</label><select class="field" name="category"><option>Operasional</option><option>Listrik / Air</option><option>Transportasi</option><option>Gaji</option><option>Sewa</option><option>Lainnya</option></select></div><div class="form-row full"><label class="field-label">Keterangan</label><input class="field" name="note" required placeholder="Contoh: beli plastik kemasan"></div><div class="form-row full"><label class="field-label">Nominal (Rp)</label><input class="field" name="amount" type="number" min="1" required></div></div>`,'Simpan Pengeluaran',f=>{expenses.push({id:uid(),date:f.get('date'),category:f.get('category'),note:f.get('note').trim(),amount:Number(f.get('amount'))});save();closeModal();render();toast('Pengeluaran dicatat.')})}
function deleteExpense(id){if(!confirm('Hapus catatan pengeluaran ini?'))return;expenses=expenses.filter(e=>e.id!==id);save();render();toast('Catatan dihapus.')}
function saveSettings(e){e.preventDefault();const f=new FormData(e.target);settings={business:f.get('business').trim(),owner:f.get('owner').trim(),tax:Number(f.get('tax')||0)};save();render();toast('Pengaturan disimpan.')}
function csvDownload(filename,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
function exportProducts(){csvDownload('kasirpro-produk.csv',[['Nama','SKU','Kategori','Harga Beli','Harga Jual','Stok','Minimum'],...products.map(p=>[p.name,p.sku,p.category,p.buy,p.price,p.stock,p.min])])}
function exportSales(){csvDownload('kasirpro-transaksi.csv',[['ID','Tanggal','Item','Subtotal','Pajak','Total','Pembayaran'],...sales.map(s=>[s.id,s.date,s.items.map(i=>`${i.name} x${i.qty}`).join('; '),s.subtotal,s.tax,s.total,s.payment])])}
function backupData(){const blob=new Blob([JSON.stringify({products,sales,expenses,settings},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kasirpro-backup.json';a.click();URL.revokeObjectURL(url)}
function resetDemo(){if(!confirm('Reset semua produk, transaksi, dan pengeluaran ke data contoh? Tindakan ini tidak dapat dibatalkan.'))return;products=defaultProducts.map(p=>({...p}));sales=[];expenses=[];settings={business:'KASIRPRO UMKM',owner:'GERDY HENDRAMAN',tax:0};cart=[];save();render();toast('Data demo direset.')}
render();
</script></body></html>
