<style>

.main{min-width:0}.topbar{height:76px;background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.eyebrow{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase}.topbar h1{font-size:20px;margin:3px 0 0}.top-right{display:flex;align-items:center;gap:10px}.pill{background:var(--green2);color:#087a4a;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:750;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.avatar{width:35px;height:35px;border-radius:50%;background:#e6eef8;color:#1e3a59;display:grid;place-items:center;font-weight:800}

.bars{height:180px;display:flex;align-items:end;gap:12px;padding:15px 4px 0;border-bottom:1px solid var(--line)}.bar-col{flex:1;min-width:0;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:min(35px,75%);background:linear-gradient(180deg,#41c98a,#149b63);border-radius:7px 7px 2px 2px;min-height:3px}.bar-col small{font-size:10px;color:var(--muted)}.bar-col span{font-size:10px;color:#526174}

.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;font-size:10px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #edf0f5;font-size:12px}tbody tr:last-child td{border-bottom:0}.prod-name{font-weight:750}.sub{display:block;font-size:11px;color:var(--muted);margin-top:3px}.badge{display:inline-block;border-radius:20px;padding:5px 8px;background:#edf8f2;color:#0b8854;font-size:10px;font-weight:750}.badge.warn{background:#fff5df;color:#a76b00}.badge.low{background:#ffeded;color:#c13c3c}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{border:1px solid #dfe5ed;border-radius:10px;background:#fff;padding:10px 12px;min-width:0;color:var(--ink)}.search{flex:1;min-width:170px}.field-label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-row{min-width:0}.form-row input,.form-row select,.form-row textarea{width:100%}textarea.field{resize:vertical;min-height:68px}.full{grid-column:1/-1}.check{display:flex;gap:9px;align-items:center;font-weight:600;cursor:pointer}.check input{width:18px;height:18px}

.cart-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.cart-item:last-child{border:0}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{padding:3px 8px;background:#eef2f6}.totals{border-top:1px dashed #d7e0e9;margin-top:10px;padding-top:12px}.total-row{display:flex;justify-content:space-between;margin:9px 0;font-size:12px}.total-row.grand{font-size:18px;font-weight:850;margin-top:15px}.qc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.qc button{padding:6px 9px;font-size:12px}

.modal-backdrop{position:fixed;inset:0;background:#0c1728a6;z-index:20;display:grid;place-items:center;padding:16px}.modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:23px;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;background:#132238;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:50;max-width:90vw}.footer{color:#98a4b4;text-align:center;font-size:11px;padding:15px}.mobile-menu{display:none}

.sub-badge{background:#fff5df;color:#a76b00;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap;border:0}.sub-badge.ok{background:var(--green2);color:#087a4a}.sub-badge.bad{background:#ffeded;color:#c13c3c}
.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.plan{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;position:relative}.plan.best{border-color:var(--green);box-shadow:0 6px 22px #16a36a1f}.plan h4{margin:0 0 6px;font-size:15px}.plan .price{font-size:24px;font-weight:850;letter-spacing:-.5px}.plan .per{color:var(--muted);font-size:12px;margin:4px 0 12px}.plan ul{padding-left:18px;margin:0 0 14px;color:#4a5568;font-size:12px}.plan .tag{position:absolute;top:-10px;right:14px;background:var(--green);color:#fff;border-radius:20px;padding:3px 9px;font-size:10px;font-weight:800}

.lockbanner{background:linear-gradient(135deg,#132238,#1d3b5a);color:#fff;border-radius:15px;padding:22px;margin-bottom:18px}.lockbanner h3{margin:0 0 6px;font-size:18px}.lockbanner p{margin:0 0 12px;color:#c6d3df}
.devid{font-family:'Courier New',monospace;font-size:20px;font-weight:800;letter-spacing:3px;background:#f3f7f9;border-radius:10px;padding:10px 14px;display:inline-block;margin-right:8px}

/* STRUK */
.rc{font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.4;color:#000;background:#fff;padding:4mm 3mm;margin:0 auto}.rc.w58{width:58mm;font-size:11px}.rc.w80{width:80mm}.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}.rl{display:flex;justify-content:space-between;gap:6px}.rl.b{font-weight:700;font-size:14px}.rc-c{text-align:center}.rc-name{font-size:15px;font-weight:700}.rc b{font-weight:700}

@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;top:0;bottom:0;width:240px;z-index:30;transition:left .2s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{padding:0 15px;height:67px}.content{padding:18px 13px}.top-right .pill{display:none}.page-head{align-items:flex-start}.page-head h2{font-size:20px}.cards{gap:9px}.stat{padding:13px}.stat-value{font-size:20px}.stat-top{font-size:11px}.stat-icon{width:29px;height:29px}.panel{padding:14px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar h1{font-size:17px}.topbar .eyebrow{font-size:9px}}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">K</div><div><strong>KASIRPRO <span style="color:#43d69b">AI</span></strong><small>SMART UMKM SYSTEM</small></div></div>
  <div><div class="nav-label">MENU UTAMA</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="pos"><span class="ico">▣</span> Kasir / POS</button>
    <button data-page="products"><span class="ico">▤</span> Produk & Stok</button>
    <button data-page="transactions"><span class="ico">↔</span> Transaksi</button>
    <button data-page="reports"><span class="ico">▥</span> Laporan</button>
    <button data-page="expenses"><span class="ico">↗</span> Pengeluaran</button>
    <button data-page="settings"><span class="ico">⚙</span> Pengaturan & Struk</button>
    <button data-page="subscription"><span class="ico">★</span> Akun & Langganan</button>
  </nav></div>
  <div class="side-bottom"><b>Data tersimpan di perangkat ini</b><br>Rutin unduh backup di menu Pengaturan agar data aman.</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;gap:10px;align-items:center"><button class="secondary mobile-menu" id="mobileMenu">☰</button><div><div class="eyebrow">SMART BUSINESS MANAGEMENT</div><h1 id="topTitle">Dashboard</h1></div></div><div class="top-right"><button class="sub-badge" id="subBadge" onclick="setPage('subscription')"></button><span class="pill" id="topBiz">● Sistem aktif</span><div class="avatar" id="topAvatar">K</div></div></header>
<div class="content" id="content"></div>
<div class="footer">KASIRPRO AI · Dibuat untuk UMKM Indonesia · GERDY HENDRAMAN</div>
</main></div>
<div id="authRoot"></div><div id="modalRoot"></div><div id="toastRoot"></div>
<div id="receiptPrint"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const pad=n=>String(n).padStart(2,'0');
const localDate=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>localDate();
const dt=s=>s?new Date(s).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';
const dtShort=s=>new Date(s).toLocaleString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const sum=(l,f)=>l.reduce((a,x)=>a+f(x),0);

const defaultProducts=[
{id:'p1',name:'Kopi Susu Gula Aren',sku:'MIN-001',category:'Minuman',buy:7000,price:15000,stock:28,min:5,emoji:'☕'},
{id:'p2',name:'Es Teh Manis',sku:'MIN-002',category:'Minuman',buy:2000,price:6000,stock:45,min:10,emoji:'🧋'},
{id:'p3',name:'Roti Cokelat',sku:'MAK-001',category:'Makanan',buy:4000,price:8000,stock:17,min:5,emoji:'🥐'},
{id:'p4',name:'Mie Goreng',sku:'MAK-002',category:'Makanan',buy:8000,price:14000,stock:12,min:4,emoji:'🍜'},
{id:'p5',name:'Air Mineral',sku:'MIN-003',category:'Minuman',buy:2500,price:5000,stock:36,min:8,emoji:'💧'},
{id:'p6',name:'Kentang Goreng',sku:'MAK-003',category:'Makanan',buy:6000,price:12000,stock:9,min:4,emoji:'🍟'}];
const defaultSettings={business:'Nama Toko Anda',address:'Jl. Contoh No. 1, Kota Anda',phone:'',header:'',footer:'Terima kasih atas kunjungan Anda!\nBarang yang sudah dibeli tidak dapat ditukar.',cashier:'Kasir',tax:0,paper:'80',autoPrint:false};
function load(key,fb){try{const v=JSON.parse(localStorage.getItem('kasirpro_'+key));return v??fb}catch{return fb}}
let products=load('products',defaultProducts), sales=load('sales',[]), expenses=load('expenses',[]);
let settings=Object.assign({},defaultSettings,load('settings',{}));
if(settings.paper!=='58')settings.paper='80';
let cart=[],activePage='dashboard',reportRange='today';
let posState={method:'Tunai',discount:'',customer:'',cash:''};
function save(){try{localStorage.setItem('kasirpro_products',JSON.stringify(products));localStorage.setItem('kasirpro_sales',JSON.stringify(sales));localStorage.setItem('kasirpro_expenses',JSON.stringify(expenses));localStorage.setItem('kasirpro_settings',JSON.stringify(settings))}catch(e){toast('Gagal menyimpan data: penyimpanan browser penuh/diblokir.')}}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toastRoot').innerHTML='',2800)}
function applyPage(paper=settings.paper){$('#pageStyle').textContent=`@page{size:${paper}mm auto;margin:0}`}
function applyBrand(){$('#topBiz').textContent='● '+settings.business;$('#topAvatar').textContent=(settings.business.trim()[0]||'K').toUpperCase();document.title=settings.business+' — KASIRPRO AI'}

/* ===== data helpers ===== */
const okSales=()=>sales.filter(s=>s.status!=='void');
const saleDay=s=>localDate(new Date(s.date));
const totalSales=l=>sum(l,s=>s.total);
const totalCOGS=l=>sum(l,s=>sum(s.items,i=>(Number(i.buy)||0)*i.qty));
function inRange(day){const t=today();if(reportRange==='today')return day===t;if(reportRange==='7d'){const d=new Date();d.setDate(d.getDate()-6);return day>=localDate(d)&&day<=t}if(reportRange==='month')return day.slice(0,7)===t.slice(0,7);return true}

/* ===== navigation ===== */
function setPage(page){activePage=page;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
const pageHead=(t,d,a='')=>`<div class="page-head"><div><h2>${t}</h2><div class="muted">${d}</div></div>${a}</div>`;
const stat=(l,v,i,n)=>`<div class="stat"><div class="stat-top">${l}<span class="stat-icon">${i}</span></div><div class="stat-value">${v}</div><div class="stat-note">${n}</div></div>`;

/* ===== STRUK ===== */
function receiptHTML(s,st=settings){
 const line=(a,b,bold)=>`<div class="rl${bold?' b':''}"><span>${a}</span><span>${b}</span></div>`;
 return `<div class="rc w${st.paper}">
 <div class="rc-c"><div class="rc-name">${esc(st.business)}</div>${st.address?`<div>${nl2br(st.address)}</div>`:''}${st.phone?`<div>Telp/WA: ${esc(st.phone)}</div>`:''}${st.header?`<div>${nl2br(st.header)}</div>`:''}</div>
 <hr>
 <div>No   : ${esc(s.id)}</div><div>Tgl  : ${dtShort(s.date)}</div><div>Kasir: ${esc(s.cashier||st.cashier)}</div>${s.customer?`<div>Plgn : ${esc(s.customer)}</div>`:''}
 <hr>
 ${s.items.map(i=>`<div>${esc(i.name)}</div>${line(`${i.qty} x ${rupiah(i.price)}`,rupiah(i.price*i.qty))}`).join('')}
 <hr>
 ${line('Subtotal',rupiah(s.subtotal))}
 ${s.discount?line('Diskon','-'+rupiah(s.discount)):''}
 ${s.tax?line(`Pajak (${s.taxPct}%)`,rupiah(s.tax)):''}
 ${line('TOTAL',rupiah(s.total),true)}
 ${line('Bayar ('+esc(s.payment)+')',rupiah(s.cash))}
 ${line('Kembali',rupiah(s.change))}
 <hr>
 ${st.footer?`<div class="rc-c">${nl2br(st.footer)}</div>`:''}
 ${s.status==='void'?'<div class="rc-c b" style="margin-top:6px">*** TRANSAKSI DIBATALKAN ***</div>':''}
 </div>`}
function receiptText(s){return [settings.business,settings.address,settings.phone?'Telp/WA: '+settings.phone:'','------------------------','No: '+s.id,'Tgl: '+dtShort(s.date),'------------------------',...s.items.map(i=>`${i.name}\n${i.qty} x ${rupiah(i.price)} = ${rupiah(i.price*i.qty)}`),'------------------------','Subtotal: '+rupiah(s.subtotal),s.discount?'Diskon: -'+rupiah(s.discount):'',s.tax?`Pajak (${s.taxPct}%): `+rupiah(s.tax):'','TOTAL: '+rupiah(s.total),`Bayar (${s.payment}): `+rupiah(s.cash),'Kembali: '+rupiah(s.change),'',settings.footer].filter(x=>x!=='').join('\n')}
function doPrint(s,st=settings){applyPage(st.paper);$('#receiptPrint').innerHTML=receiptHTML(s,st);setTimeout(()=>window.print(),80)}
window.addEventListener('afterprint',()=>{$('#receiptPrint').innerHTML='';applyPage()});
function showReceipt(id,isNew){
 const s=sales.find(x=>x.id===id);if(!s)return;
 $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" style="width:min(430px,100%)"><h3>${isNew?'✓ Pembayaran berhasil':'Struk '+esc(s.id)}</h3><div class="rc-wrap">${receiptHTML(s)}</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">${isNew?'Transaksi baru':'Tutup'}</button><button class="secondary" onclick="shareWA('${s.id}')">WhatsApp</button><button class="primary" id="btnPrint" onclick="doPrint(sales.find(x=>x.id==='${s.id}'))">🖨 Cetak Struk</button></div></div></div>`;
 $('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};
 if(isNew&&settings.autoPrint)setTimeout(()=>doPrint(s),250);
}
function shareWA(id){const s=sales.find(x=>x.id===id);if(s)window.open('https://wa.me/?text='+encodeURIComponent(receiptText(s)),'_blank')}

/* ===== DASHBOARD ===== */
function transactionTable(list,actions=true){
 if(!list.length)return `<div class="empty">Belum ada transaksi.</div>`;
 return `<div class="table-wrap"><table><thead><tr><th>No. Transaksi</th><th>Waktu</th><th>Item</th><th>Total</th><th>Bayar</th><th>Status</th>${actions?'<th>Aksi</th>':''}</tr></thead><tbody>${list.map(s=>`<tr><td><b>${esc(s.id)}</b>${s.customer?`<span class="sub">${esc(s.customer)}</span>`:''}</td><td>${dt(s.date)}</td><td>${sum(s.items,i=>i.qty)} unit</td><td><b>${rupiah(s.total)}</b></td><td>${esc(s.payment)}</td><td><span class="badge ${s.status==='void'?'low':''}">${s.status==='void'?'Dibatalkan':'Selesai'}</span></td>${actions?`<td><button class="secondary tiny" onclick="showReceipt('${s.id}')">🧾 Struk</button>${s.status==='void'?'':` <button class="danger tiny" onclick="voidSale('${s.id}')">Batalkan</button>`}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function dashboard(){
 const ts=okSales().filter(s=>saleDay(s)===today()),revenue=totalSales(ts),profit=revenue-totalCOGS(ts),low=products.filter(p=>p.stock<=p.min);
 const last7=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const key=localDate(d);return{key,label:d.toLocaleDateString('id-ID',{weekday:'short'}),value:totalSales(okSales().filter(s=>saleDay(s)===key))}});
 const max=Math.max(1,...last7.map(x=>x.value));
 const sold={};okSales().forEach(s=>s.items.forEach(i=>sold[i.name]=(sold[i.name]||0)+i.qty));
 const best=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `${pageHead('Ringkasan Bisnis','Pantau performa usaha kamu hari ini.',`<button class="primary" onclick="setPage('pos')">＋ Transaksi Baru</button>`)}
<div class="cards">${stat('Omzet Hari Ini',rupiah(revenue),'↗',`${ts.length} transaksi selesai`)}${stat('Estimasi Laba Kotor',rupiah(profit),'◈','Omzet dikurangi HPP barang terjual')}${stat('Total Transaksi',ts.length,'▣','Transaksi hari ini')}${stat('Stok Menipis',low.length,'⚠',low.length?'Perlu segera diperiksa':'Semua stok aman')}</div>
<div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Tren Penjualan</h3><p>Omzet selama 7 hari terakhir</p></div><span class="badge">7 hari</span></div><div class="bars">${last7.map(x=>`<div class="bar-col"><span>${x.value?rupiah(x.value).replace('Rp','').trim():'-'}</span><div class="bar" style="height:${Math.max(3,x.value/max*75)}%"></div><small>${x.label}</small></div>`).join('')}</div></section>
<section class="panel"><div class="panel-head"><div><h3>Akses Cepat</h3><p>Fitur yang sering digunakan</p></div></div><div class="quick-grid"><button class="quick" onclick="setPage('pos')">🧾<b>Buka Kasir</b><small>Mulai penjualan</small></button><button class="quick" onclick="openProductModal()">📦<b>Tambah Produk</b><small>Kelola katalog</small></button><button class="quick" onclick="setPage('reports')">📊<b>Lihat Laporan</b><small>Analisis penjualan</small></button><button class="quick" onclick="setPage('settings')">🖨<b>Atur Struk</b><small>Nama, alamat, ukuran</small></button></div></section></div>
<div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Transaksi Terbaru</h3><p>Aktivitas penjualan terakhir</p></div><button class="secondary tiny" onclick="setPage('transactions')">Lihat semua</button></div>${transactionTable(sales.slice().reverse().slice(0,5),false)}</section>
<section class="panel"><div class="panel-head"><div><h3>Perlu Perhatian</h3><p>Stok di bawah batas minimum</p></div><button class="secondary tiny" onclick="setPage('products')">Kelola stok</button></div>${low.length?`<div class="table-wrap"><table><thead><tr><th>Produk</th><th>Sisa stok</th></tr></thead><tbody>${low.slice(0,6).map(p=>`<tr><td><b>${esc(p.name)}</b><span class="sub">${esc(p.sku)}</span></td><td><span class="badge low">${p.stock} unit</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">✅</div>Stok masih aman</div>`}</section></div>
<div class="panel"><div class="panel-head"><div><h3>Produk Terlaris</h3><p>Berdasarkan jumlah unit terjual</p></div></div>${best.length?`<div class="table-wrap"><table><thead><tr><th>Produk</th><th>Terjual</th></tr></thead><tbody>${best.map(([n,q])=>`<tr><td>${esc(n)}</td><td><b>${q} unit</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Belum ada data penjualan. Mulai transaksi pertamamu!</div>`}</div>`}

/* ===== PRODUK ===== */
function productsPage(){return `${pageHead('Produk & Stok','Kelola katalog, harga, dan persediaan.',`<button class="primary" onclick="openProductModal()">＋ Tambah Produk</button>`)}
<div class="cards">${stat('Total Produk',products.length,'▤','Produk aktif')}${stat('Total Unit Stok',sum(products,p=>p.stock),'📦','Akumulasi seluruh stok')}${stat('Nilai Modal Stok',rupiah(sum(products,p=>p.stock*p.buy)),'◈','Berdasarkan harga beli')}${stat('Stok Menipis',products.filter(p=>p.stock<=p.min).length,'⚠','Di bawah batas minimum')}</div>
<div class="panel"><div class="toolbar"><input class="field search" id="productSearch" placeholder="Cari nama, SKU, atau kategori…"><select class="field" id="categoryFilter"><option value="">Semua kategori</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="secondary" onclick="exportProducts()">⇩ Ekspor CSV</button></div><div id="productTable">${productTable(products)}</div></div>`}
function productTable(list){if(!list.length)return `<div class="empty">Produk tidak ditemukan.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Produk</th><th>SKU / Kategori</th><th>Harga beli</th><th>Harga jual</th><th>Stok</th><th>Margin</th><th>Aksi</th></tr></thead><tbody>${list.map(p=>`<tr><td><span style="font-size:20px;margin-right:8px">${esc(p.emoji||'📦')}</span><span class="prod-name">${esc(p.name)}</span></td><td>${esc(p.sku)}<span class="sub">${esc(p.category)}</span></td><td>${rupiah(p.buy)}</td><td><b>${rupiah(p.price)}</b></td><td><span class="badge ${p.stock<=p.min?'low':p.stock<=p.min*1.5?'warn':''}">${p.stock}</span></td><td>${p.price?Math.round((p.price-p.buy)/p.price*100):0}%</td><td><button class="secondary tiny" onclick="openProductModal('${p.id}')">Edit</button> <button class="secondary tiny" onclick="adjustStock('${p.id}')">Stok ±</button> <button class="danger tiny" onclick="deleteProduct('${p.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
function bindProducts(){const q=$('#productSearch'),c=$('#categoryFilter');const f=()=>$('#productTable').innerHTML=productTable(products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q.value.toLowerCase())&&(!c.value||p.category===c.value)));q.oninput=f;c.onchange=f}
function openProductModal(id){const p=products.find(x=>x.id===id)||{name:'',sku:'',category:'Umum',buy:'',price:'',stock:0,min:3,emoji:'📦'};openModal(id?'Edit Produk':'Tambah Produk',`<div class="form-grid"><div class="form-row full"><label class="field-label">Nama produk *</label><input class="field" name="name" required value="${esc(p.name)}"></div><div class="form-row"><label class="field-label">SKU / kode / barcode</label><input class="field" name="sku" value="${esc(p.sku)}"></div><div class="form-row"><label class="field-label">Kategori</label><input class="field" name="category" value="${esc(p.category)}" required></div><div class="form-row"><label class="field-label">Harga beli (Rp)</label><input class="field" name="buy" type="number" min="0" required value="${p.buy}"></div><div class="form-row"><label class="field-label">Harga jual (Rp)</label><input class="field" name="price" type="number" min="0" required value="${p.price}"></div><div class="form-row"><label class="field-label">Stok saat ini</label><input class="field" name="stock" type="number" min="0" required value="${p.stock}" ${id?'readonly':''}></div><div class="form-row"><label class="field-label">Batas stok minimum</label><input class="field" name="min" type="number" min="0" required value="${p.min}"></div><div class="form-row full"><label class="field-label">Emoji produk</label><input class="field" name="emoji" value="${esc(p.emoji||'📦')}" maxlength="8"></div></div>${id?'<p class="muted" style="font-size:11px">Untuk mengubah stok, gunakan tombol Stok ± di tabel produk.</p>':''}`,id?'Simpan Perubahan':'Tambah Produk',f=>{const d={name:f.get('name').trim(),sku:f.get('sku').trim()||'SKU-'+uid().toUpperCase(),category:f.get('category').trim(),buy:Number(f.get('buy')),price:Number(f.get('price')),stock:Number(f.get('stock')),min:Number(f.get('min')),emoji:f.get('emoji')||'📦'};if(d.price<0||d.buy<0||d.stock<0)return toast('Nilai tidak boleh negatif.');if(products.some(x=>x.sku===d.sku&&x.id!==id))return toast('SKU sudah digunakan.');if(id)Object.assign(products.find(x=>x.id===id),d);else products.push({id:uid(),...d});save();closeModal();render();toast('Data produk disimpan.')})}
function adjustStock(id){const p=products.find(x=>x.id===id);if(!p)return;openModal('Penyesuaian Stok',`<p>Produk: <b>${esc(p.name)}</b><br>Stok saat ini: <b>${p.stock}</b></p><div class="form-row"><label class="field-label">Perubahan stok (+ masuk / − keluar)</label><input class="field" name="delta" type="number" required value="1"></div><div class="form-row" style="margin-top:12px"><label class="field-label">Alasan</label><input class="field" name="reason" required placeholder="Contoh: barang masuk / stok opname"></div>`,'Simpan Stok',f=>{const d=Number(f.get('delta'));if(p.stock+d<0)return toast('Stok tidak boleh negatif.');p.stock+=d;save();closeModal();render();toast('Stok disesuaikan.')})}
function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p||!confirm(`Hapus produk "${p.name}"? Riwayat transaksi lama tidak terpengaruh.`))return;products=products.filter(x=>x.id!==id);cart=cart.filter(i=>i.id!==id);save();render();toast('Produk dihapus.')}

/* ===== KASIR / POS ===== */
function calc(){const subtotal=cart.reduce((a,i)=>a+i.price*i.qty,0),discount=Math.min(Math.max(Number(posState.discount)||0,0),subtotal),taxable=subtotal-discount,tax=Math.round(taxable*(Number(settings.tax)||0)/100);return{subtotal,discount,tax,total:taxable+tax}}
function posPage(){return `${pageHead('Kasir / POS','Pilih produk, atur jumlah, lalu selesaikan pembayaran.',`<span class="badge">● Siap melayani</span>`)}
<div class="pos-layout"><section class="panel"><div class="toolbar"><input class="field search" id="posSearch" placeholder="Cari produk atau scan barcode/SKU lalu Enter…" autocomplete="off"><select class="field" id="posCategory"><option value="">Semua kategori</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="product-grid" id="posProducts">${posProducts(products)}</div></section>
<section class="panel" id="cartPanel">${cartPanel()}</section></div>`}
function posProducts(list){if(!list.length)return `<div class="empty" style="grid-column:1/-1">Produk tidak ditemukan.</div>`;return list.map(p=>`<button class="product-card" onclick="addCart('${p.id}')" ${p.stock<=0?'disabled':''}><div class="product-emoji">${esc(p.emoji||'📦')}</div><b>${esc(p.name)}</b><small>${esc(p.sku)} · Stok ${p.stock}</small><strong>${rupiah(p.price)}</strong></button>`).join('')}
function cartHTML(){if(!cart.length)return `<div class="empty"><div class="big">🛒</div>Keranjang masih kosong.<br><small>Pilih produk di sebelah kiri.</small></div>`;return cart.map(i=>`<div class="cart-item"><div><b>${esc(i.name)}</b><div class="sub">${rupiah(i.price)} / unit</div><div class="qty"><button onclick="changeQty('${i.id}',-1)">−</button><b>${i.qty}</b><button onclick="changeQty('${i.id}',1)">+</button><button class="danger tiny" onclick="removeCart('${i.id}')">Hapus</button></div></div><b>${rupiah(i.price*i.qty)}</b></div>`).join('')}
function cartPanel(){return `<div class="panel-head"><div><h3>🛒 Keranjang</h3><p>${cart.reduce((a,i)=>a+i.qty,0)} item dipilih</p></div><button class="danger tiny" onclick="clearCart()">Kosongkan</button></div><div>${cartHTML()}</div>
<div class="totals"><div class="form-row"><label class="field-label">Nama pelanggan (opsional)</label><input class="field" value="${esc(posState.customer)}" oninput="posState.customer=this.value"></div>
<div class="total-row" style="margin-top:12px"><span>Subtotal</span><b id="tSub"></b></div>
<div class="form-row"><label class="field-label">Diskon (Rp)</label><input class="field" type="number" min="0" value="${esc(posState.discount)}" oninput="posState.discount=this.value;updateTotals()"></div>
<div class="total-row"><span id="tTaxLbl"></span><b id="tTax"></b></div>
<div class="total-row grand"><span>Total</span><span id="tTotal"></span></div>
<div class="form-row" style="margin-top:12px"><label class="field-label">Metode pembayaran</label><select class="field" onchange="posState.method=this.value;updateTotals()">${['Tunai','QRIS','Transfer bank','Debit'].map(m=>`<option ${posState.method===m?'selected':''}>${m}</option>`).join('')}</select></div>
<div id="cashRow"><div class="form-row" style="margin-top:12px"><label class="field-label">Uang diterima (Rp)</label><input class="field" id="pCash" type="number" min="0" placeholder="Masukkan nominal" value="${esc(posState.cash)}" oninput="posState.cash=this.value;updateTotals()"><div class="qc"><button class="secondary" onclick="quickCash(0)">Uang pas</button>${[20000,50000,100000].map(n=>`<button class="secondary" onclick="quickCash(${n})">${n/1000}rb</button>`).join('')}</div></div>
<div class="total-row"><span>Kembalian</span><b id="tChange"></b></div></div>
<button class="primary" style="width:100%;margin-top:10px;padding:14px" onclick="checkout()">✓ Selesaikan Pembayaran</button></div>`}
function updateTotals(){if(!$('#tSub'))return;const t=calc();$('#tSub').textContent=rupiah(t.subtotal);$('#tTaxLbl').textContent=`Pajak (${Number(settings.tax)||0}%)`;$('#tTax').textContent=rupiah(t.tax);$('#tTotal').textContent=rupiah(t.total);$('#cashRow').style.display=posState.method==='Tunai'?'':'none';$('#tChange').textContent=rupiah(Math.max(0,(Number(posState.cash)||0)-t.total))}
function refreshCart(){$('#cartPanel').innerHTML=cartPanel();updateTotals()}
function quickCash(n){const t=calc();posState.cash=n===0?t.total:n;$('#pCash').value=posState.cash;updateTotals()}
function bindPos(){const search=$('#posSearch'),cat=$('#posCategory');const filter=()=>{const q=search.value.toLowerCase(),c=cat.value;$('#posProducts').innerHTML=posProducts(products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q)&&(!c||p.category===c)))};search.oninput=filter;cat.onchange=filter;
 search.onkeydown=e=>{if(e.key!=='Enter')return;const q=search.value.trim().toLowerCase();if(!q)return;const exact=products.find(p=>p.sku.toLowerCase()===q);const list=products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(q));const hit=exact||(list.length===1?list[0]:null);if(hit){addCart(hit.id);search.value='';filter()}else toast(list.length?'Pilih produk dari daftar.':'Produk tidak ditemukan.')}}
function addCart(id){const p=products.find(p=>p.id===id);if(!p||p.stock<1)return toast('Stok produk habis.');const it=cart.find(i=>i.id===id);if(it){if(it.qty>=p.stock)return toast('Jumlah melebihi stok tersedia.');it.qty++}else cart.push({id:p.id,name:p.name,price:Number(p.price),buy:Number(p.buy),qty:1});refreshCart()}
function changeQty(id,n){const i=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);if(!i)return;if(i.qty+n<1)return removeCart(id);if(n>0&&p&&i.qty+n>p.stock)return toast('Jumlah melebihi stok tersedia.');i.qty+=n;refreshCart()}
function removeCart(id){cart=cart.filter(i=>i.id!==id);refreshCart()}
function clearCart(){cart=[];posState.discount='';posState.cash='';refreshCart()}
function checkout(){
 if(isLocked()){setPage('subscription');return toast('Masa langganan berakhir. Aktifkan langganan untuk melanjutkan.')}
 if(!cart.length)return toast('Keranjang masih kosong.');
 for(const i of cart){const p=products.find(p=>p.id===i.id);if(!p||p.stock<i.qty)return toast(`Stok ${i.name} tidak mencukupi.`)}
 const t=calc(),method=posState.method,cash=method==='Tunai'?Number(posState.cash||0):t.total;
 if(cash<t.total)return toast('Uang diterima belum mencukupi.');
 const prefix='INV-'+today().replace(/-/g,'')+'-',n=sales.filter(s=>s.id.startsWith(prefix)).length+1;
 const sale={id:prefix+String(n).padStart(3,'0'),date:new Date().toISOString(),cashier:settings.cashier,customer:posState.customer.trim(),items:cart.map(i=>({...i})),subtotal:t.subtotal,discount:t.discount,taxPct:Number(settings.tax)||0,tax:t.tax,total:t.total,payment:method,cash,change:cash-t.total,status:'ok'};
 sale.items.forEach(i=>{products.find(p=>p.id===i.id).stock-=i.qty});
 sales.push(sale);save();cart=[];posState={method,discount:'',customer:'',cash:''};render();showReceipt(sale.id,true)}

/* ===== TRANSAKSI ===== */
function transactionsPage(){return `${pageHead('Riwayat Transaksi','Telusuri penjualan, cetak ulang struk, atau batalkan transaksi.',`<button class="secondary" onclick="exportSales()">⇩ Ekspor CSV</button>`)}<div class="panel"><div class="toolbar"><input class="field search" id="trxSearch" placeholder="Cari nomor transaksi / pelanggan…"><input class="field" type="date" id="trxDate"><button class="secondary" id="trxClear">Reset</button></div><div id="trxTable">${transactionTable(sales.slice().reverse())}</div></div>`}
function bindTransactions(){const q=$('#trxSearch'),d=$('#trxDate');const f=()=>{$('#trxTable').innerHTML=transactionTable(sales.slice().reverse().filter(s=>(s.id+' '+s.payment+' '+(s.customer||'')).toLowerCase().includes(q.value.toLowerCase())&&(!d.value||saleDay(s)===d.value)))};q.oninput=f;d.onchange=f;$('#trxClear').onclick=()=>{q.value='';d.value='';f()}}
function voidSale(id){const s=sales.find(x=>x.id===id);if(!s||s.status==='void')return;if(!confirm(`Batalkan transaksi ${id}? Stok barang akan dikembalikan dan transaksi tidak dihitung di laporan.`))return;s.items.forEach(i=>{const p=products.find(p=>p.id===i.id);if(p)p.stock+=i.qty});s.status='void';s.voidAt=new Date().toISOString();save();render();toast('Transaksi dibatalkan, stok dikembalikan.')}

/* ===== LAPORAN ===== */
function reportsPage(){
 const rs=okSales().filter(s=>inRange(saleDay(s))),ex=expenses.filter(e=>inRange(e.date)),rev=totalSales(rs),cogs=totalCOGS(rs),exp=sum(ex,e=>e.amount),disc=sum(rs,s=>s.discount||0);
 const byPay={};rs.forEach(s=>byPay[s.payment]=(byPay[s.payment]||0)+s.total);
 const sold={};rs.forEach(s=>s.items.forEach(i=>{sold[i.name]=sold[i.name]||{q:0,v:0};sold[i.name].q+=i.qty;sold[i.name].v+=i.qty*i.price}));
 const top=Object.entries(sold).sort((a,b)=>b[1].q-a[1].q).slice(0,10);
 const days={};rs.forEach(s=>{const k=saleDay(s);days[k]=days[k]||{n:0,rev:0,cogs:0};days[k].n++;days[k].rev+=s.total;days[k].cogs+=totalCOGS([s])});
 const ranges=[['today','Hari ini'],['7d','7 hari'],['month','Bulan ini'],['all','Semua']];
 return `${pageHead('Laporan Bisnis','Ringkasan penjualan dan estimasi keuntungan.',`<button class="secondary" onclick="exportSales()">⇩ Ekspor penjualan</button>`)}
<div class="toolbar">${ranges.map(([k,l])=>`<button class="${reportRange===k?'primary':'secondary'}" onclick="reportRange='${k}';render()">${l}</button>`).join('')}</div>

async function api(path,payload,method='POST'){
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);
 try{
  const r=await fetch('/api/'+path,{method,signal:ctl.signal,headers:{'Content-Type':'application/json',...(sub.token?{Authorization:'Bearer '+sub.token}:{})},body:method==='GET'?undefined:JSON.stringify(payload||{})});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){const e=new Error(d.error||'Server error ('+r.status+')');e.status=r.status;throw e}
  return d
 }catch(e){if(e.status)throw e;const n=new Error('Tidak bisa terhubung ke server. Periksa koneksi internet Anda.');n.network=true;throw n}
 finally{clearTimeout(t)}}
function applyMe(d){
 sub.user=d.user;sub.st={trialEnd:d.trialEnd,paidUntil:d.paidUntil||0,revoked:!!d.revoked};
 sub.offset=(d.serverNow||Date.now())-Date.now();sub.lastOk=Date.now();sub.lastSeen=Date.now();saveSub()}
function logoutLocal(expired){sub.token='';sub.user=null;sub.st=null;saveSub();if(expired)toast('Sesi berakhir, silakan masuk lagi.');render()}

 if(!sub.token)return false;
 try{applyMe(await api('me',null,'GET'));return true}
 catch(e){if(e.status===401)logoutLocal(true);return false}}

 if(!authed())return;const before=subStatus().state;await refreshMe();
 if(!authed())return;

function subStatus(){
 if(!authed())return{state:'noauth',locked:true};
 const s=sub.st;if(!s)return{state:'unknown',locked:true};
 const raw=Date.now(),now=raw+(sub.offset||0);
 if(sub.lastSeen-raw>DAY)return{state:'tampered',locked:true};
 if(s.revoked)return{state:'revoked',locked:true};
 if(raw-sub.lastOk>SUB_CFG.offlineDays*DAY)return{state:'offline',locked:true};
 if(s.paidUntil>now)return{state:'active',locked:false,left:Math.ceil((s.paidUntil-now)/DAY),end:s.paidUntil};
 if(!s.paidUntil&&s.trialEnd>now)return{state:'trial',locked:false,left:Math.ceil((s.trialEnd-now)/DAY),end:s.trialEnd};
 return{state:'expired',locked:true,end:Math.max(s.paidUntil||0,s.trialEnd)}}

 if(!authed()){el.style.display='none';return}
 el.style.display='';const st=subStatus();let t,c='';
 if(st.state==='trial'){t=`🎁 Uji coba: ${st.left} hari lagi`;c=st.left<=3?'':'ok'}
 else if(st.state==='active'){t=st.left<=7?`⏳ Langganan: ${st.left} hari lagi`:'✓ Langganan aktif';c=st.left<=7?'':'ok'}
 else{t='🔒 Langganan berakhir';c='bad'}
 el.className='sub-badge '+c;el.textContent=t}

 return `${pageHead('Akun & Langganan','Gratis 14 hari, setelah itu berlangganan untuk terus memakai KASIRPRO AI.')}${head}${plans}
<div class="panel"><div class="panel-head"><div><h3>🔑 Aktivasi kode langganan</h3><p>Masukkan kode yang dikirim admin setelah pembayaran dikonfirmasi.</p></div></div>
<form id="actForm"><div class="form-row"><label class="field-label">Kode aktivasi</label><input class="field" id="actCode" placeholder="KP-AB12-CD34-EF56" autocomplete="off" style="text-transform:uppercase"></div><button class="primary" style="margin-top:12px" type="submit">Aktifkan</button></form>
<div class="notice" style="margin:16px 0 0"><b>Cara berlangganan:</b> 1) pilih paket lalu chat WhatsApp, 2) lakukan pembayaran. ${esc(SUB_CFG.payInfo)} 3) terima kode aktivasi, 4) masukkan kode di atas. Kode terhubung ke akun Anda dan hanya bisa dipakai sekali.</div></div>${acc}`}
function bindSub(){
 const f=$('#actForm');if(!f)return;
 f.onsubmit=async e=>{
  e.preventDefault();const code=$('#actCode').value.trim();if(!code)return toast('Masukkan kode aktivasi.');
  const btn=f.querySelector('button');btn.disabled=true;
  try{const d=await api('activate',{code});applyMe(d);toast('Langganan aktif sampai '+new Date(d.paidUntil).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+'.');render()}
  catch(ex){toast(ex.message);btn.disabled=false}}}
setInterval(()=>{touch();updateSubBadge();if(authed()&&isLocked()&&activePage!=='subscription'){render();toast('Masa langganan berakhir.')}},60000);
setInterval(syncSub,600000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&authed()&&Date.now()-sub.lastOk>300000)syncSub()});

/* ===== MODAL & RENDER ===== */
function openModal(title,body,submitLabel,submit){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><h3>${title}</h3><form id="modalForm">${body}<div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary" type="submit">${submitLabel}</button></div></form></div></div>`;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};$('#modalForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target))}}
function closeModal(){$('#modalRoot').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function render(){
 if(!authed()){renderAuth();return}
 $('#authRoot').innerHTML='';
 touch();
 if(isLocked()&&activePage!=='subscription'){activePage='subscription';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='subscription'))}
 const titles={dashboard:'Dashboard',pos:'Kasir / POS',products:'Produk & Stok',transactions:'Riwayat Transaksi',reports:'Laporan Bisnis',expenses:'Pengeluaran',settings:'Pengaturan & Struk',subscription:'Akun & Langganan'};
 $('#topTitle').textContent=titles[activePage]||'KASIRPRO';
 $('#content').innerHTML=({dashboard,products:productsPage,pos:posPage,transactions:transactionsPage,reports:reportsPage,expenses:expensesPage,settings:settingsPage,subscription:subscriptionPage})[activePage]();
 if(activePage==='products')bindProducts();
 if(activePage==='pos'){bindPos();updateTotals()}
 if(activePage==='transactions')bindTransactions();
 if(activePage==='settings')bindSettings();
 if(activePage==='subscription')bindSub();
 updateSubBadge();
}
applyPage();applyBrand();render();syncSub();
</script></body></html>
