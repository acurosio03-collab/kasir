<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KASIRPRO — Panel Admin</title>
<style>
:root{--bg:#f4f7fb;--ink:#182230;--muted:#718096;--line:#e5eaf1;--green:#16a36a;--red:#dc4c4c;--navy:#132238}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:16px}main{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h3{margin:0 0 12px;font-size:15px}input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #dfe5ed;background:#fff;min-width:0}
button{cursor:pointer;border:0;font-weight:650;background:#edf2f7;color:#253449}button.p{background:var(--green);color:#fff}button.d{background:#fff0f0;color:var(--red)}button.t{padding:6px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button.on{background:var(--green);color:#fff}
.tw{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid #edf0f5;font-size:13px}
.b{display:inline-block;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:750;background:#edf8f2;color:#0b8854}.b.w{background:#fff5df;color:#a76b00}.b.r{background:#ffeded;color:#c13c3c}.b.g{background:#eef2f6;color:#4a5568}
.code{font-family:'Courier New',monospace;font-weight:800;letter-spacing:1px}.msg{margin:10px 0;font-size:13px}.err{color:var(--red)}.ok{color:#0b8854}.muted{color:var(--muted)}
.gen{display:grid;gap:8px;margin-top:14px}.gen div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f3f7f9;border-radius:10px;padding:10px 12px}
</style></head><body>
<header><b>🔐 KASIRPRO — Panel Admin</b><span id="who"></span></header>
<main>
<div class="card" id="loginCard">
 <h3>Masuk admin</h3>
 <div class="row"><div><label>Kunci admin (ADMIN_KEY)</label><input id="key" type="password" autocomplete="off" style="min-width:260px"></div><button class="p" id="enter">Masuk</button></div>
 <div class="msg err" id="loginErr"></div>
</div>
<div id="app" style="display:none">
 <div class="tabs"><button data-t="gen" class="on">Buat kode</button><button data-t="users">Pelanggan</button><button data-t="codes">Riwayat kode</button><button id="out">Keluar</button></div>

 <div id="t-gen" class="card">
  <h3>Buat kode aktivasi</h3>
  <div class="row">
   <div><label>Paket</label><select id="preset"><option value="Bulanan|30">Bulanan (30 hari)</option><option value="3 Bulan|90">3 Bulan (90 hari)</option><option value="Tahunan|365">Tahunan (365 hari)</option><option value="Kustom|">Kustom…</option></select></div>
   <div><label>Hari</label><input id="days" type="number" min="1" max="3650" value="30" style="width:100px"></div>
   <div><label>Jumlah kode</label><input id="count" type="number" min="1" max="50" value="1" style="width:100px"></div>
   <div><label>Catatan (mis. nama pelanggan)</label><input id="note" maxlength="100" style="min-width:220px"></div>
   <button class="p" id="gen">Buat kode</button>
  </div>
  <div class="msg" id="genMsg"></div><div class="gen" id="genOut"></div>
 </div>

 <div id="t-users" class="card" style="display:none">
  <h3>Pelanggan <span class="muted" id="uCount"></span></h3>
  <div class="row" style="margin-bottom:12px"><input id="uq" placeholder="Cari nama / email / WhatsApp…" style="min-width:260px"><button id="uReload">↻ Muat ulang</button></div>
  <div class="tw" id="uTable"></div>
 </div>

 <div id="t-codes" class="card" style="display:none">
  <h3>200 kode terakhir</h3>
  <div class="tw" id="cTable"></div>
 </div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY=''; try{KEY=sessionStorage.getItem('kp_admin')||''}catch{}
let USERS=[];
const fmt=t=>t?new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
async function call(action,data={}){
 const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify({action,...data})});
 let d={};try{d=await r.json()}catch{}
 if(!r.ok)throw Object.assign(new Error(d.error||'Error '+r.status),{status:r.status});
 return d}
async function enter(){
 $('#loginErr').textContent='';
 try{await call('codes');try{sessionStorage.setItem('kp_admin',KEY)}catch{}
  $('#loginCard').style.display='none';$('#app').style.display='';$('#who').textContent='Admin';loadUsers();loadCodes()}
 catch(e){$('#loginErr').textContent=e.status===401?'Kunci admin salah.':e.message}}
$('#enter').onclick=()=>{KEY=$('#key').value;enter()};
$('#key').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()};
$('#out').onclick=()=>{try{sessionStorage.removeItem('kp_admin')}catch{}location.reload()};
document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs [data-t]').forEach(x=>x.classList.toggle('on',x===b));
 ['gen','users','codes'].forEach(t=>$('#t-'+t).style.display=t===b.dataset.t?'':'none');
 if(b.dataset.t==='users')loadUsers();if(b.dataset.t==='codes')loadCodes()});
$('#preset').onchange=()=>{const [,d]=$('#preset').value.split('|');if(d)$('#days').value=d};
$('#gen').onclick=async()=>{
 const [plan]=$('#preset').value.split('|'),btn=$('#gen');btn.disabled=true;$('#genMsg').textContent='';
 try{const d=await call('gen',{plan,days:Number($('#days').value),count:Number($('#count').value),note:$('#note').value});
  $('#genMsg').innerHTML=`<span class="ok">${d.codes.length} kode dibuat (${esc(d.plan)}, ${d.days} hari).</span>`;
  $('#genOut').innerHTML=d.codes.map(c=>{const txt=`Terima kasih sudah berlangganan KASIRPRO AI.\nKode aktivasi Anda: ${c}\n\nMasukkan di menu Akun & Langganan > Aktivasi kode.`;
   return `<div><span class="code">${c}</span><button class="t" onclick="navigator.clipboard.writeText('${c}').then(()=>this.textContent='Tersalin ✓')">Salin</button><a href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener"><button class="t p">Kirim via WhatsApp</button></a></div>`}).join('');
  loadCodes()}
 catch(e){$('#genMsg').innerHTML=`<span class="err">${esc(e.message)}</span>`}
 btn.disabled=false};
function status(u){const n=Date.now(),p=u.paid_until?new Date(u.paid_until).getTime():0,t=new Date(u.trial_ends_at).getTime();
 if(u.revoked)return['Diblokir','r'];if(p>n)return['Aktif sampai '+fmt(p),'']; if(!p&&t>n)return['Trial sampai '+fmt(t),'w'];return['Berakhir','g']}
async function loadUsers(){
 try{USERS=(await call('users')).users;renderUsers()}catch(e){$('#uTable').innerHTML=`<span class="err">${esc(e.message)}</span>`}}
function renderUsers(){
 const q=$('#uq').value.toLowerCase(),list=USERS.filter(u=>(u.name+u.email+u.phone).toLowerCase().includes(q));
 $('#uCount').textContent='('+list.length+' dari '+USERS.length+')';
 $('#uTable').innerHTML=list.length?`<table><thead><tr><th>Nama</th><th>Email</th><th>WhatsApp</th><th>Daftar</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map(u=>{const [s,c]=status(u);return `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td><a href="https://wa.me/${esc(u.phone)}" target="_blank" rel="noopener">${esc(u.phone)}</a></td><td>${fmt(u.created_at)}</td><td><span class="b ${c}">${esc(s)}</span></td><td><button class="t" onclick="extend(${u.id})">+ Hari</button> <button class="t" onclick="resetpw(${u.id})">Reset password</button> <button class="t ${u.revoked?'p':'d'}" onclick="revoke(${u.id},${!u.revoked})">${u.revoked?'Buka blokir':'Blokir'}</button></td></tr>`}).join('')}</tbody></table>`:'<span class="muted">Belum ada pelanggan.</span>'}
$('#uq').oninput=renderUsers;$('#uReload').onclick=loadUsers;
async function act(a,d,okMsg){try{await call(a,d);alert(okMsg);loadUsers()}catch(e){alert(e.message)}}
function extend(id){const d=prompt('Tambah berapa hari? (angka negatif untuk mengurangi)','30');if(d===null)return;act('extend',{userId:id,days:Number(d)},'Masa aktif diperbarui.')}
function revoke(id,v){if(confirm(v?'Blokir akun ini? Pengguna langsung terkunci saat aplikasi terhubung ke server.':'Buka blokir akun ini?'))act('revoke',{userId:id,revoked:v},v?'Akun diblokir.':'Blokir dibuka.')}
function resetpw(id){const p=prompt('Password baru (min. 8 karakter). Kirim ke pelanggan lewat WhatsApp:');if(p===null)return;act('resetpw',{userId:id,password:p},'Password diganti.')}
async function loadCodes(){
 try{const rows=(await call('codes')).codes;
  $('#cTable').innerHTML=rows.length?`<table><thead><tr><th>Kode</th><th>Paket</th><th>Hari</th><th>Dibuat</th><th>Catatan</th><th>Status</th></tr></thead><tbody>${rows.map(c=>`<tr><td class="code">${esc(c.code)}</td><td>${esc(c.plan)}</td><td>${c.days}</td><td>${fmt(c.created_at)}</td><td>${esc(c.note)}</td><td>${c.used_at?`<span class="b g">Dipakai ${fmt(c.used_at)} · ${esc(c.used_by_email||'-')}</span>`:'<span class="b">Belum dipakai</span>'}</td></tr>`).join('')}</tbody></table>`:'<span class="muted">Belum ada kode.</span>'}
 catch(e){$('#cTable').innerHTML=`<span class="err">${esc(e.message)}</span>`}}
if(KEY){enter()}
</script></body></html>
